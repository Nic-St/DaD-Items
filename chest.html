<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darker DB - Loot Chest Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            color: #aaa;
            font-size: 1.1em;
        }

        .chest-container {
            text-align: center;
            margin: 40px 0;
        }

        .chest-button {
            font-size: 120px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            user-select: none;
            line-height: 1;
        }

        .chest-button:hover:not(:disabled) {
            transform: scale(1.1);
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.6));
        }

        .chest-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .chest-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .open-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e72 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .open-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .open-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .open-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loot-display {
            margin-top: 40px;
            min-height: 400px;
        }

        .item-reward {
            background: rgba(30, 30, 50, 0.9);
            border: 3px solid #ff6b6b;
            border-radius: 12px;
            padding: 30px;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(255, 107, 107, 0.3);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5) rotateZ(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotateZ(0);
                opacity: 1;
            }
        }

        .rarity-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .rarity-poor {
            background: rgba(128, 128, 128, 0.3);
            color: #999;
            border: 2px solid #666;
        }

        .rarity-common {
            background: rgba(100, 150, 100, 0.3);
            color: #90ee90;
            border: 2px solid #4a7c4e;
        }

        .rarity-uncommon {
            background: rgba(70, 130, 180, 0.3);
            color: #87ceeb;
            border: 2px solid #4682b4;
        }

        .rarity-rare {
            background: rgba(75, 0, 130, 0.3);
            color: #da70d6;
            border: 2px solid #663399;
        }

        .rarity-epic {
            background: rgba(255, 140, 0, 0.3);
            color: #ffa500;
            border: 2px solid #ff8c00;
        }

        .rarity-legendary {
            background: rgba(255, 215, 0, 0.3);
            color: #ffd700;
            border: 2px solid #daa520;
        }

        .rarity-unique {
            background: rgba(220, 20, 60, 0.3);
            color: #ff6347;
            border: 2px solid #dc143c;
        }

        .item-name {
            font-size: 2em;
            font-weight: bold;
            margin: 15px 0;
            color: #fff;
        }

        .item-description {
            font-size: 0.95em;
            color: #bbb;
            margin: 15px 0;
            font-style: italic;
            line-height: 1.5;
        }

        .item-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 25px;
            text-align: left;
        }

        .stat-block {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #ff6b6b;
        }

        .stat-label {
            color: #999;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: #fff;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 107, 107, 0.3);
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid #ff6b6b;
            color: #ff9999;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .nav-buttons {
            text-align: center;
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-button {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid #ff6b6b;
            color: #ff9999;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .nav-button:hover {
            background: rgba(255, 107, 107, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .chest-button {
                font-size: 80px;
            }

            h1 {
                font-size: 1.8em;
            }

            .item-name {
                font-size: 1.5em;
            }

            .item-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Loot Chest Simulator</h1>
            <div class="subtitle">Open a chest and receive a random item from Darker DB</div>
        </header>

        <div class="chest-container">
            <div class="chest-button" id="chest-emoji">📦</div>
            <button class="open-button" id="open-button">Open Chest</button>
        </div>

        <div class="loot-display" id="loot-display"></div>

        <div class="nav-buttons">
            <a href="index.html" class="nav-button">📚 Browse All Items</a>
            <button class="nav-button" id="open-again-button" style="display: none;">Open Another</button>
        </div>
    </div>

    <script>
        let allItems = [];
        let rarityWeights = {};

        async function loadItems() {
            try {
                const response = await fetch('./data/all_items.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                allItems = await response.json();
                
                if (!Array.isArray(allItems) || allItems.length === 0) {
                    throw new Error('Items data is empty');
                }

                // Calculate rarity distribution from actual data
                rarityWeights = {};
                allItems.forEach(item => {
                    if (!rarityWeights[item.rarity]) {
                        rarityWeights[item.rarity] = 0;
                    }
                    rarityWeights[item.rarity]++;
                });

                // Convert to weights (probability)
                const total = Object.values(rarityWeights).reduce((a, b) => a + b, 0);
                Object.keys(rarityWeights).forEach(rarity => {
                    rarityWeights[rarity] = rarityWeights[rarity] / total;
                });

                console.log('Items loaded:', allItems.length);
                console.log('Rarity distribution:', rarityWeights);

                document.getElementById('open-button').disabled = false;

            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('loot-display').innerHTML = `
                    <div class="error-message">
                        <strong>Error Loading Items</strong><br>
                        ${error.message}<br>
                        Make sure data/all_items.json exists in your repository.
                    </div>
                `;
            }
        }

        function getRandomItemByRarity() {
            if (allItems.length === 0) return null;

            // Pick a random rarity based on distribution
            const rand = Math.random();
            let cumulative = 0;
            let selectedRarity = null;

            for (const [rarity, weight] of Object.entries(rarityWeights)) {
                cumulative += weight;
                if (rand <= cumulative) {
                    selectedRarity = rarity;
                    break;
                }
            }

            // Get all items of that rarity
            const itemsOfRarity = allItems.filter(item => item.rarity === selectedRarity);
            
            if (itemsOfRarity.length === 0) return null;

            // Return a random item from that rarity
            return itemsOfRarity[Math.floor(Math.random() * itemsOfRarity.length)];
        }

        function displayItem(item) {
            const statsList = [];

            if (item.gear_score) statsList.push({ label: 'Gear Score', value: item.gear_score });
            if (item.vendor_price) statsList.push({ label: 'Vendor Price', value: item.vendor_price });
            if (item.experience) statsList.push({ label: 'Experience', value: item.experience });
            if (item.adventure_points) statsList.push({ label: 'Adventure Points', value: item.adventure_points });
            
            // Primary stats
            if (item.primary_min_armor_rating) {
                const val = item.primary_max_armor_rating === item.primary_min_armor_rating 
                    ? item.primary_min_armor_rating 
                    : `${item.primary_min_armor_rating}-${item.primary_max_armor_rating}`;
                statsList.push({ label: 'Armor Rating', value: val });
            }
            if (item.primary_min_dexterity) {
                const val = item.primary_max_dexterity === item.primary_min_dexterity 
                    ? item.primary_min_dexterity 
                    : `${item.primary_min_dexterity}-${item.primary_max_dexterity}`;
                statsList.push({ label: 'Dexterity', value: val });
            }
            if (item.primary_min_move_speed) {
                const val = item.primary_max_move_speed === item.primary_min_move_speed 
                    ? item.primary_min_move_speed 
                    : `${item.primary_min_move_speed}-${item.primary_max_move_speed}`;
                statsList.push({ label: 'Move Speed', value: val });
            }

            const statsHTML = statsList.length > 0 
                ? `<div class="item-stats">
                     ${statsList.map(stat => `
                       <div class="stat-block">
                         <div class="stat-label">${stat.label}</div>
                         <div class="stat-value">${stat.value}</div>
                       </div>
                     `).join('')}
                   </div>`
                : '';

            const html = `
                <div class="item-reward">
                    <div class="rarity-badge rarity-${item.rarity.toLowerCase()}">
                        ✨ ${item.rarity}
                    </div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-description">${item.description || 'A mysterious item'}</div>
                    <div style="margin: 15px 0; font-size: 0.9em; color: #999;">
                        <strong>${item.type}</strong>${item.slot_type ? ` • ${item.slot_type}` : ''}${item.armor_type ? ` • ${item.armor_type}` : ''}
                    </div>
                    ${statsHTML}
                </div>
            `;

            document.getElementById('loot-display').innerHTML = html;
            document.getElementById('open-again-button').style.display = 'inline-block';
        }

        function openChest() {
            const button = document.getElementById('open-button');
            const chest = document.getElementById('chest-emoji');
            
            button.disabled = true;
            chest.textContent = '📭';

            // Animation delay
            setTimeout(() => {
                const item = getRandomItemByRarity();
                if (item) {
                    displayItem(item);
                    chest.textContent = '📦';
                } else {
                    document.getElementById('loot-display').innerHTML = 
                        '<div class="error-message">No items found in database</div>';
                }
                button.disabled = false;
            }, 600);
        }

        // Event listeners
        document.getElementById('open-button').addEventListener('click', openChest);
        document.getElementById('open-again-button').addEventListener('click', openChest);
        document.getElementById('chest-emoji').addEventListener('click', openChest);

        // Load items on page load
        loadItems();
    </script>
</body>
</html>
